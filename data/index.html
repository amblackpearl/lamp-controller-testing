<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modul LED Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    body {
      font-family: "Inter", sans-serif;
    }
    .pulse-good {
      animation: pulse-green 1.5s ease-in-out infinite;
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    }
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .led-off {
      filter: brightness(0.3) saturate(0.5);
      opacity: 0.6;
    }
    .led-on-blue {
      animation: pulse-blue 1s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
    }
    .led-on-red {
      animation: pulse-red 1s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }
    .led-on-green {
      animation: pulse-green-sensor 1s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
    }
    @keyframes pulse-blue {
      0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.6); }
      50% { box-shadow: 0 0 15px rgba(59, 130, 246, 1); }
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 15px rgba(239, 68, 68, 1); }
    }
    @keyframes pulse-green-sensor {
      0%, 100% { box-shadow: 0 0 5px rgba(34, 197, 94, 0.6); }
      50% { box-shadow: 0 0 15px rgba(34, 197, 94, 1); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 p-4">
  <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-blue-700 px-5 py-4 text-center">
      <div class="flex items-center justify-center space-x-3">
        <!-- Logo Pertama -->
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
          <img src="/logo.svg" alt="L1" class="w-6 h-6" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIj48cmVjdCB4PSI1IiB5PSI1IiB3aWR0aD0iMTQiIGhlaWdodD0iMTQiIHJ4PSIyIi8+PHJlY3QgeD0iOSIgeT0iOSIgd2lkdGg9IjYiIGhlaWdodD0iNiIvPjwvc3ZnPg=='">
        </div>
        
        <!-- Logo Kedua -->
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
          <img src="/Logo-SEI.svg" alt="L2" class="w-6 h-6" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIj48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI4Ii8+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iNCIvPjwvc3ZnPg=='">
        </div>
        
        <div class="text-left">
          <h1 class="text-lg font-bold text-white">SEHEN CONTROLLER TESTING</h1>
        </div>
      </div>
    </div>

    <!-- Connection Status -->
    <div class="px-5 py-3 bg-gray-50 border-b">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div id="connection-dot" class="w-2 h-2 rounded-full bg-yellow-500"></div>
          <span id="connection-text" class="text-sm font-medium text-gray-700">Connecting...</span>
        </div>
        <span class="text-xs text-gray-500" id="host-display"></span>
      </div>
    </div>

    <!-- Sensor Cards - Compact Grid -->
    <div class="p-4">
      <div class="grid grid-cols-3 gap-3 mb-4">
        <!-- Voltage -->
        <div class="bg-blue-50 p-3 rounded-lg text-center border border-blue-100">
          <div class="text-xs font-semibold text-blue-600 mb-1">VOLTAGE</div>
          <div id="v-value" class="text-xl font-bold text-blue-800">--</div>
          <div class="text-xs text-gray-500 mt-1">V</div>
        </div>

        <!-- Current -->
        <div class="bg-amber-50 p-3 rounded-lg text-center border border-amber-100">
          <div class="text-xs font-semibold text-amber-600 mb-1">CURRENT</div>
          <div id="a-value" class="text-xl font-bold text-amber-800">--</div>
          <div class="text-xs text-gray-500 mt-1">mA</div>
        </div>

        <!-- Power -->
        <div class="bg-emerald-50 p-3 rounded-lg text-center border border-emerald-100">
          <div class="text-xs font-semibold text-emerald-600 mb-1">POWER</div>
          <div id="p-value" class="text-xl font-bold text-emerald-800">--</div>
          <div class="text-xs text-gray-500 mt-1">W</div>
        </div>
      </div>

      <!-- LED Indicators Grid -->
      <div class="mb-4">
        <div class="text-center mb-2">
          <span class="text-sm font-semibold text-gray-700">SENSOR STATUS</span>
        </div>
        
        <div class="grid grid-cols-3 gap-3">
          <!-- LED Blue -->
          <div id="led-blue-card" class="bg-gradient-to-b from-blue-50 to-blue-100 p-4 rounded-lg border border-blue-200 text-center transition-all duration-300">
            <div id="led-blue-indicator" class="w-12 h-12 rounded-full bg-blue-400 border-2 border-blue-300 mx-auto mb-2 led-off"></div>
            <div class="text-xs font-semibold text-blue-700">BLUE LED</div>
            <div id="led-blue-status" class="text-xs text-gray-600 mt-1">OFF</div>
          </div>

          <!-- LED Red -->
          <div id="led-red-card" class="bg-gradient-to-b from-red-50 to-red-100 p-4 rounded-lg border border-red-200 text-center transition-all duration-300">
            <div id="led-red-indicator" class="w-12 h-12 rounded-full bg-red-400 border-2 border-red-300 mx-auto mb-2 led-off"></div>
            <div class="text-xs font-semibold text-red-700">RED LED</div>
            <div id="led-red-status" class="text-xs text-gray-600 mt-1">OFF</div>
          </div>

          <!-- IR Sensor -->
          <div id="ir-card" class="bg-gradient-to-b from-green-50 to-green-100 p-4 rounded-lg border border-green-200 text-center transition-all duration-300">
            <div id="ir-indicator" class="w-12 h-12 rounded-full bg-green-400 border-2 border-green-300 mx-auto mb-2 led-off">
              <svg class="w-6 h-6 mx-auto mt-3 text-green-200" fill="currentColor" viewBox="0 0 20 20">
                <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"/>
              </svg>
            </div>
            <div class="text-xs font-semibold text-green-700">IR SENSOR</div>
            <div id="ir-status" class="text-xs text-gray-600 mt-1">OFF</div>
          </div>
        </div>
      </div>

      <!-- Classification Card -->
      <div class="mb-3">
        <div class="text-center mb-2">
          <span class="text-sm font-semibold text-gray-700">CLASSIFICATION</span>
        </div>

        <div id="classification-card" class="rounded-lg border-2 border-gray-200 transition-all duration-300">
          <!-- Default State (--) -->
          <div id="status-default" class="p-4 fade-in">
            <div class="flex items-center justify-center space-x-3">
              <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center border-2 border-gray-300">
                <svg class="w-6 h-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V7z" clip-rule="evenodd"></path>
                </svg>
              </div>
              <div class="text-left">
                <h2 class="text-lg font-bold text-gray-500">--</h2>
                <p class="text-xs text-gray-400">Voltage < 1V (Idle)</p>
              </div>
            </div>
          </div>

          <!-- NOT GOOD State -->
          <div id="status-notgood" class="hidden p-4 fade-in">
            <div class="flex items-center justify-center space-x-3">
              <div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center border-2 border-red-200">
                <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
              </div>
              <div class="text-left">
                <h2 class="text-lg font-bold text-red-600">NOT GOOD</h2>
                <p class="text-xs text-gray-600">LED unstable or changes detected</p>
              </div>
            </div>
          </div>

          <!-- GOOD State -->
          <div id="status-good" class="hidden p-4 fade-in">
            <div class="flex items-center justify-center space-x-3">
              <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center border-2 border-green-200 pulse-good">
                <svg class="w-6 h-6 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                </svg>
              </div>
              <div class="text-left">
                <h2 class="text-lg font-bold text-green-600">GOOD</h2>
                <p class="text-xs text-gray-600">Stable for 5+ seconds</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="bg-gray-50 rounded-lg p-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div id="classification-dot" class="w-2 h-2 rounded-full bg-gray-400"></div>
            <span id="classification-status" class="text-sm font-medium text-gray-700">Idle (V < 1)</span>
          </div>
          <div class="text-right">
            <div class="text-xs text-gray-500" id="update-time">--:--:--</div>
            <div class="text-xs text-gray-400">Updated</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-5 py-3 bg-gray-100 border-t">
      <div class="flex items-center justify-between">
        <div class="text-xs text-gray-600">
          WebSocket • <span id="status-indicator" class="font-medium">Idle</span>
        </div>
        <div class="flex items-center space-x-2">
          <div class="w-1.5 h-1.5 rounded-full bg-gray-400"></div>
          <span class="text-xs text-gray-500">Offline</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const host = window.location.hostname;
    document.getElementById('host-display').textContent = host;
    
    let socket;
    let reconnectTimeout;
    let lastUpdateTime = null;
    let isConnected = false;
    let classificationTimer = null;
    let classificationReady = false;
    let notGoodLatched = false;
    let goodStableTimer = null;
    let goodStableReady = false;
    const GOOD_STABLE_TIME = 1500; // ms

    function updateLEDStatus(isGood) {
      const ledBlue = document.getElementById('led-blue-indicator');
      const ledRed = document.getElementById('led-red-indicator');
      const irSensor = document.getElementById('ir-indicator');
      const ledBlueStatus = document.getElementById('led-blue-status');
      const ledRedStatus = document.getElementById('led-red-status');
      const irStatus = document.getElementById('ir-status');
      const ledBlueCard = document.getElementById('led-blue-card');
      const ledRedCard = document.getElementById('led-red-card');
      const irCard = document.getElementById('ir-card');

      if (isGood) {
        // Turn ON all indicators
        ledBlue.classList.remove('led-off');
        ledBlue.classList.add('led-on-blue');
        ledBlueStatus.textContent = 'ON';
        ledBlueStatus.className = 'text-xs text-blue-600 font-semibold';
        ledBlueCard.className = 'bg-gradient-to-b from-blue-100 to-blue-200 p-4 rounded-lg border border-blue-300 text-center transition-all duration-300';

        ledRed.classList.remove('led-off');
        ledRed.classList.add('led-on-red');
        ledRedStatus.textContent = 'ON';
        ledRedStatus.className = 'text-xs text-red-600 font-semibold';
        ledRedCard.className = 'bg-gradient-to-b from-red-100 to-red-200 p-4 rounded-lg border border-red-300 text-center transition-all duration-300';

        irSensor.classList.remove('led-off');
        irSensor.classList.add('led-on-green');
        irStatus.textContent = 'ACTIVE';
        irStatus.className = 'text-xs text-green-600 font-semibold';
        irCard.className = 'bg-gradient-to-b from-green-100 to-green-200 p-4 rounded-lg border border-green-300 text-center transition-all duration-300';
      } else {
        // Turn OFF all indicators
        ledBlue.classList.remove('led-on-blue');
        ledBlue.classList.add('led-off');
        ledBlueStatus.textContent = 'OFF';
        ledBlueStatus.className = 'text-xs text-gray-600';
        ledBlueCard.className = 'bg-gradient-to-b from-blue-50 to-blue-100 p-4 rounded-lg border border-blue-200 text-center transition-all duration-300';

        ledRed.classList.remove('led-on-red');
        ledRed.classList.add('led-off');
        ledRedStatus.textContent = 'OFF';
        ledRedStatus.className = 'text-xs text-gray-600';
        ledRedCard.className = 'bg-gradient-to-b from-red-50 to-red-100 p-4 rounded-lg border border-red-200 text-center transition-all duration-300';

        irSensor.classList.remove('led-on-green');
        irSensor.classList.add('led-off');
        irStatus.textContent = 'OFF';
        irStatus.className = 'text-xs text-gray-600';
        irCard.className = 'bg-gradient-to-b from-green-50 to-green-100 p-4 rounded-lg border border-green-200 text-center transition-all duration-300';
      }
    }

    function updateTimeDisplay() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { 
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('update-time').textContent = timeStr;
      lastUpdateTime = Date.now();
    }

    function updateConnectionStatus(connected, message) {
      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-text');
      const indicator = document.getElementById('status-indicator');
      const footerDot = document.querySelector('.w-1\\.5.h-1\\.5');
      
      if (connected) {
        dot.className = 'w-2 h-2 rounded-full bg-green-500';
        text.textContent = message || 'Connected';
        text.className = 'text-sm font-medium text-green-700';
        indicator.textContent = 'Connected';
        indicator.className = 'font-medium text-green-600';
        footerDot.className = 'w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse';
        document.querySelector('.text-gray-500').textContent = 'Live';
        isConnected = true;
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
        text.textContent = message || 'Disconnected';
        text.className = 'text-sm font-medium text-red-600';
        indicator.textContent = 'Disconnected';
        indicator.className = 'font-medium text-red-500';
        footerDot.className = 'w-1.5 h-1.5 rounded-full bg-gray-400';
        document.querySelector('.text-gray-500').textContent = 'Offline';
        isConnected = false;
        // Turn off LED indicators when disconnected
        updateLEDStatus(false);
      }
    }
    
    function updateClassification(voltage, klasifikasi) {
      const defaultEl = document.getElementById('status-default');
      const notGoodEl = document.getElementById('status-notgood');
      const goodEl = document.getElementById('status-good');
      const card = document.getElementById('classification-card');
      const dot = document.getElementById('classification-dot');
      const statusText = document.getElementById('classification-status');

      // Hide all classification states
      defaultEl.classList.add('hidden');
      notGoodEl.classList.add('hidden');
      goodEl.classList.add('hidden');

      // IDLE → RESET ALL STATES
      if (voltage < 1) {
        if (classificationTimer) {
          clearTimeout(classificationTimer);
          classificationTimer = null;
        }
        if (goodStableTimer) {
          clearTimeout(goodStableTimer);
          goodStableTimer = null;
        }

        classificationReady = false;
        notGoodLatched = false;
        goodStableReady = false;

        defaultEl.classList.remove('hidden');
        card.className = 'rounded-lg border-2 border-gray-200 transition-all duration-300';
        dot.className = 'w-2 h-2 rounded-full bg-gray-400';
        statusText.textContent = 'Idle (V < 1)';
        statusText.className = 'text-sm font-medium text-gray-600';
        
        // Turn off LED indicators
        updateLEDStatus(false);
        return;
      }

      // MONITORING → START 10s TIMER
      if (!classificationReady) {
        if (!classificationTimer) {
          classificationTimer = setTimeout(() => {
            classificationReady = true;
            classificationTimer = null;
          }, 30000);
        }

        defaultEl.classList.remove('hidden');
        card.className = 'rounded-lg border-2 border-blue-200 transition-all duration-300';
        dot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-pulse';
        statusText.textContent = 'Monitoring...';
        statusText.className = 'text-sm font-medium text-blue-600';
        
        // Keep LEDs OFF during monitoring
        updateLEDStatus(false);
        return;
      }

      // AFTER 10s → EVALUATION

      // 🚨 ABSOLUTE PRIORITY: NOT GOOD
      if (klasifikasi === false) {
        notGoodLatched = true;

        if (goodStableTimer) {
          clearTimeout(goodStableTimer);
          goodStableTimer = null;
        }

        notGoodEl.classList.remove('hidden');
        card.className = 'rounded-lg border-2 border-red-200 transition-all duration-300';
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
        statusText.textContent = 'Quality: NOT GOOD';
        statusText.className = 'text-sm font-medium text-red-600';
        
        // Turn off LED indicators for NOT GOOD
        updateLEDStatus(false);
        return;
      }

      // ⛔ JIKA PERNAH NOT GOOD → GOOD DILARANG TOTAL
      if (notGoodLatched) {
        updateLEDStatus(false);
        return;
      }

      // =========================
      // GOOD → HARUS STABIL
      // =========================
      if (klasifikasi === true) {
        if (!goodStableTimer && !goodStableReady) {
          goodStableTimer = setTimeout(() => {
            goodStableReady = true;
          }, GOOD_STABLE_TIME);
        }

        // ⏳ BELUM STABIL → EVALUATING
        if (!goodStableReady) {
          defaultEl.classList.remove('hidden');
          card.className = 'rounded-lg border-2 border-blue-200 transition-all duration-300';
          dot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-pulse';
          statusText.textContent = 'Evaluating...';
          statusText.className = 'text-sm font-medium text-blue-600';
          
          // Keep LEDs OFF while evaluating stability
          updateLEDStatus(false);
          return;
        }

        // ✅ GOOD FINAL
        goodEl.classList.remove('hidden');
        card.className = 'rounded-lg border-2 border-green-300 transition-all duration-300';
        dot.className = 'w-2 h-2 rounded-full bg-green-500 animate-pulse';
        statusText.textContent = 'Quality: GOOD';
        statusText.className = 'text-sm font-medium text-green-700';
        
        // Turn ON all LED indicators
        updateLEDStatus(true);
        return;
      }
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${host}/ws`);

      socket.onopen = () => {
        console.log('✅ WebSocket connected');
        updateConnectionStatus(true, 'Connected');
        
        if (reconnectTimeout) {
          clearTimeout(reconnectTimeout);
          reconnectTimeout = null;
        }
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          const v = parseFloat(data.V);
          const a = parseFloat(data.A);
          const p = parseFloat(data.P);
          const klasifikasi = data.klasifikasi;

          // Update sensor values
          document.getElementById('v-value').textContent = (isNaN(v) || v < 0) ? '--' : v.toFixed(2);
          
          // Display current in mA
          document.getElementById('a-value').textContent = (isNaN(a) || a < 0) ? '--' : a.toFixed(0);
          
          document.getElementById('p-value').textContent = (isNaN(p) || p < 0) ? '--' : p.toFixed(2);

          // Update classification based on voltage threshold
          updateClassification(v, klasifikasi);

          // Update timestamp
          updateTimeDisplay();

        } catch (error) {
          console.error('❌ Error parsing JSON:', error);
        }
      };

      socket.onerror = (error) => {
        console.error('❌ WebSocket error:', error);
        updateConnectionStatus(false, 'Error');
        updateClassification(0, null);
        updateLEDStatus(false);
      };

      socket.onclose = () => {
        console.log('🔌 WebSocket disconnected');
        updateConnectionStatus(false, 'Disconnected');
        updateClassification(0, null);
        updateLEDStatus(false);
        
        // Auto-reconnect after 3 seconds
        reconnectTimeout = setTimeout(() => {
          console.log('🔄 Reconnecting...');
          connectWebSocket();
        }, 3000);
      };
    }

    // Initial connection
    connectWebSocket();

    // Update timestamp every second when connected
    setInterval(() => {
      if (isConnected && lastUpdateTime) {
        const secondsAgo = Math.floor((Date.now() - lastUpdateTime) / 1000);
        const timeEl = document.getElementById('update-time');
        
        if (secondsAgo > 5) {
          const baseTime = timeEl.textContent.split(' (')[0];
          timeEl.textContent = `${baseTime} (${secondsAgo}s ago)`;
          timeEl.className = 'text-xs text-amber-600';
        } else {
          timeEl.className = 'text-xs text-gray-500';
        }
      }
    }, 1000);

    // Initialize LED indicators to OFF state
    updateLEDStatus(false);
  </script>
</body>
</html>
